<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Cartões | Economia Smart</title>
  <link rel="icon" href="../assets/logo.png">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar"></aside>
    <main class="main">
      <div class="content">
        <div id="mobileHeader"></div>
        <header class="topbar">
          <div><h1>Cartões</h1><p class="page-description">Visualize cartões vinculados à conta, status, limites e dívida. A versão web não emite itens nem manipula o inventário do jogador.</p></div>
        </header>
        <div id="notice" class="notice hidden" role="status"></div>
        
<section class="card compact mb-16"><div class="row"><div><span class="muted">Cartões encontrados</span><div id="cardsCount" class="metric-value">—</div></div><span class="badge good">Consulta segura</span></div></section>
<section id="cardsList" class="card-list"></section>

      </div>
    </main>
  </div>
  <script type="module" src="../js/cartoes.js"></script>

</html>
